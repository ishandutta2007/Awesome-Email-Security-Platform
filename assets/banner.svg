<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.1); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }
    @keyframes pulseShield {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.6)); }
      100% { transform: scale(1); opacity: 0.9; }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }
    .particle { animation: floatParticle 4s ease-in-out infinite; }
    .particle-delay1 { animation-delay: 1s; }
    .particle-delay2 { animation-delay: 2s; }
    .shield-icon { animation: pulseShield 3s ease-in-out infinite; transform-origin: 150px 150px; }
    .wave-line { stroke-dasharray: 10, 10; animation: waveDash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Dynamic Background Geometric Elements (Pill/Nodes in background layer) -->
  <g opacity="0.25">
    <circle cx="1020" cy="80" r="40" fill="url(#accentGrad)" class="particle"/>
    <circle cx="950" cy="220" r="25" fill="#3b82f6" class="particle particle-delay1"/>
    <circle cx="1100" cy="200" r="15" fill="#ec4899" class="particle particle-delay2"/>
    <path d="M 850 150 Q 950 80 1050 150 T 1200 150" fill="none" stroke="url(#accentGrad)" stroke-width="3" class="wave-line"/>
  </g>

  <!-- Animated Shield Badge Icon on Left -->
  <g class="shield-icon">
    <path d="M 150 70 L 210 100 V 160 C 210 205 150 235 150 235 C 150 235 90 205 90 160 V 100 Z" fill="url(#shieldGrad)" filter="url(#glow)"/>
    <!-- Email Envelope inside Shield -->
    <rect x="120" y="125" width="60" height="40" rx="4" fill="#ffffff" opacity="0.95"/>
    <path d="M 120 125 L 150 148 L 180 125" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 150 165 L 165 150" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <!-- Checkmark inside Shield -->
    <path d="M 140 145 L 148 153 L 163 138" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FOREGROUND TEXT (Title & Subtitle explicitly placed to avoid obstruction) -->
  <g fill="#ffffff">
    <!-- Main Title -->
    <text x="260" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
      Awesome Email Security Platform 🛡️
    </text>

    <!-- Gradient Accent Line -->
    <rect x="260" y="150" width="860" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Subtitle -->
    <text x="260" y="195" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">
      Curated Guide to Enterprise Email Security (SaaS &amp; Open-Source Platforms)
    </text>

    <!-- Category Pills / Tags in Foreground -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      <!-- Tag 1 -->
      <rect x="260" y="220" width="160" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="340" y="240" fill="#38bdf8" text-anchor="middle">Phishing Defense 🎣</text>

      <!-- Tag 2 -->
      <rect x="435" y="220" width="150" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="510" y="240" fill="#a78bfa" text-anchor="middle">BEC Protection 🔒</text>

      <!-- Tag 3 -->
      <rect x="600" y="220" width="150" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="675" y="240" fill="#f472b6" text-anchor="middle">DLP &amp; Archiving 📦</text>

      <!-- Tag 4 -->
      <rect x="765" y="220" width="160" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="845" y="240" fill="#34d399" text-anchor="middle">Open-Source &amp; Gateway 🌐</text>
    </g>
  </g>
</svg>
